 [package]
name = "tree-sitter-vbscript"
description = "VBScript grammar for the tree-sitter parsing library"
version = "0.2.0"
authors = ["Sasa Cetkovic <sasa.cetkovic@outlook.cz>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "vbscript"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/SasaCetkovic/tree-sitter-vbscript"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.7"
