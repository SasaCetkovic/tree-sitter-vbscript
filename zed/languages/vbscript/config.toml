name = "VBScript"
grammar = "vbscript"
# Only standalone scripts. Classic ASP pages (.asp, .asa) mix HTML with
# <% %> blocks that this grammar does not parse; the asp-classic extension
# handles those.
path_suffixes = ["vbs"]
line_comments = ["' ", "REM "]
tab_size = 4
hard_tabs = false
autoclose_before = ")"
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]

# A block that is still being typed has no closing keyword yet, so it is an
# ERROR node with no syntax range to indent from. These line patterns cover
# that case; indents.scm handles closing keywords once the block is complete.
#
# Indent after: [Public|Private] [Default] Sub/Function/Class/Property ...,
# For, Do, While, With, Select Case, Case, Else, and lines ending in Then.
# The Then must be outside strings and comments ("..." pairs and no ').
# Known gap: one-line blocks such as `For i = 1 To 3: x = i: Next` still
# indent the next line.
increase_indent_pattern = "(?i)^\\s*((public|private)\\s+)?(default\\s+)?(sub|function|class|property\\s+(get|let|set))\\b|^\\s*(for|do|while|with|select\\s+case|case|else)\\b|^([^'\"]|\"[^\"]*\")*\\bthen\\s*('.*)?$"

# Outdent one level from the previous line. For Else/ElseIf this is the only
# rule: they are typed before End If exists, so the If is still an ERROR node.
# For closing keywords, indents.scm aligns them with the block's first line;
# this pattern covers a closer typed right after an opener line (e.g. Else,
# then End If), where Zed would otherwise indent from the opener.
# Known gap: after an empty last Case, End Select ends up one level too deep.
# A valid_after rule would fix that but misplace the outer End Select of
# nested Select blocks.
decrease_indent_pattern = "(?i)^\\s*(else|elseif|end|next|loop|wend)\\b"
